services:
  phototracker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - "${HOST_LIBRARY_PATH:-./examples/photos}:/photos:ro"
      - phototracker_data:/data
      # Optional host bind mount (directory must be writable by container UID 10001):
      # - "${HOST_DATA_PATH:-./data}:/data"
    environment:
      LIBRARY_PATH: /photos
      DB_PATH: /data/photos.db
      CACHE_PATH: /data/cache
      HOST: 0.0.0.0
      PORT: 8080
      AUTH_DISABLED: "${AUTH_DISABLED:-false}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-change-me}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      AUTH_SECRET: "${AUTH_SECRET:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SYNC_WORKERS: "${SYNC_WORKERS:-}"
      PREVIEW_WORKERS: "${PREVIEW_WORKERS:-}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  phototracker_data:
